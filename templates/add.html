<!DOCTYPE html>
<html>

<head>

    <title>Add Patient</title>

</head>

<body>

    <h1>Add Patient</h1>

    <form method="POST">

        <input type="text"
        name="fullname"
        placeholder="Full Name"
        required>

        <br><br>

        <input type="date"
        name="dob"
        required>

        <br><br>

        <input type="email"
        name="email"
        placeholder="Email"
        required>

        <br><br>

        <input type="number"
        step="0.01"
        name="glucose"
        placeholder="Glucose"
        required>

        <br><br>

        <input type="number"
        step="0.01"
        name="haemoglobin"
        placeholder="Haemoglobin"
        required>

        <br><br>

        <input type="number"
        step="0.01"
        name="cholesterol"
        placeholder="Cholesterol"
        required>

        <br><br>

        <button type="submit">Save</button>

    </form>

</body>
</html>
