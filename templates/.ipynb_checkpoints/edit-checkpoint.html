<!DOCTYPE html>
<html>

<head>

    <title>Edit Patient</title>

</head>

<body>

    <h1>Edit Patient</h1>

    <form method="POST">

        <input type="text"
        name="fullname"
        value="{{ patient.fullname }}"
        required>

        <br><br>

        <input type="date"
        name="dob"
        value="{{ patient.dob }}"
        required>

        <br><br>

        <input type="email"
        name="email"
        value="{{ patient.email }}"
        required>

        <br><br>

        <input type="number"
        step="0.01"
        name="glucose"
        value="{{ patient.glucose }}"
        required>

        <br><br>

        <input type="number"
        step="0.01"
        name="haemoglobin"
        value="{{ patient.haemoglobin }}"
        required>

        <br><br>

        <input type="number"
        step="0.01"
        name="cholesterol"
        value="{{ patient.cholesterol }}"
        required>

        <br><br>

        <button type="submit">Update</button>

    </form>

</body>
</html>
